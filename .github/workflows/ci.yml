# PR and main CI. Fixture replay only: no live PayPal or OpenAI calls and no repository secrets, ever.
# Actions are pinned to commit SHAs (tag in the trailing comment).
name: ci

on:
  pull_request:
    # Markdown-only PRs skip CI (Actions minutes on a private repo, BL-01); ticket files stay checked.
    paths: ["**", "!**/*.md", ".github/plan/**"]
  push:
    branches: [main]

# A new push to a PR cancels its older run; runs on main always finish.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    name: landing checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # DB-backed tests run against the same Postgres as compose.yaml (BL-01). Throwaway CI credentials,
    # not secrets. REQUIRE_DB=1 makes those tests fail instead of skip when the database is unreachable.
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: cleared
          POSTGRES_PASSWORD: cleared
          POSTGRES_DB: cleared
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cleared -d cleared"
          --health-interval 1s
          --health-timeout 3s
          --health-retries 30
          --health-start-period 5s
    env:
      DATABASE_URL: postgres://cleared:cleared@localhost:5432/cleared
      REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (reads packageManager)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: migrate (Drizzle + pg-boss schema, as `make up`)
        run: pnpm --filter @cleared/db run migrate
      - run: ./scripts/landing-checks.sh

  # M4-02: the eval suite replays the committed OpenAI recordings offline (msw refuses any request), so a
  # prompt, model or schema change without fresh recordings fails here ("recording stale"). Then the
  # README "Measured results" block must equal docs/evidence/eval-report.json.
  eval-replay:
    name: eval replay
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (reads packageManager)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm eval --mode replay --set all --split test
      - run: pnpm eval:check-readme

  # M4-04: the Core Web Vitals budget (lighthouserc.json) on a local production build with seeded data, on
  # the msw PayPal stub (apps/web/scripts/lhci.ts), and the dashboard's first-load JS budget.
  lhci:
    name: lighthouse ci
    # report-only by owner decision 2026-11-04 (#142); budgets in lighthouserc.json unchanged
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: cleared
          POSTGRES_PASSWORD: cleared
          POSTGRES_DB: cleared
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cleared -d cleared"
          --health-interval 1s
          --health-timeout 3s
          --health-retries 30
          --health-start-period 5s
    env:
      DATABASE_URL: postgres://cleared:cleared@localhost:5432/cleared
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (reads packageManager)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate && pnpm db:seed
      - name: Playwright Chromium (seeding and Lighthouse's browser)
        run: pnpm --filter @cleared/web exec playwright install --with-deps chromium
      - run: pnpm --filter @cleared/web build
      - run: pnpm lhci autorun --upload.target=filesystem --upload.outputDir="$RUNNER_TEMP/lhci"
      - name: dashboard first-load JS ≤ 200 KB gzip
        run: |
          pnpm --filter @cleared/web analyze --json > "$RUNNER_TEMP/bundle.json"
          node -e 'const b=require(process.argv[1]);console.log(`dashboard ${b.dashboardFirstLoadGzipKB} KB gz`);if(b.dashboardFirstLoadGzipKB>200)process.exit(1)' "$RUNNER_TEMP/bundle.json"

  # BL-01 6649703652 (owner approved in chat 2026-11-05): the default Playwright project (recorded fixtures +
  # msw stubs, no secrets) on every PR and on main. Same flow as the local run: migrate, seed, build, test.
  # Opt-in specs (E2E_LIVE, E2E_REVIEW, E2E_BASE_URL) stay unset and skip, as locally.
  e2e:
    name: e2e (playwright)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    concurrency:
      group: e2e-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: cleared
          POSTGRES_PASSWORD: cleared
          POSTGRES_DB: cleared
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cleared -d cleared"
          --health-interval 1s
          --health-timeout 3s
          --health-retries 30
          --health-start-period 5s
    env:
      DATABASE_URL: postgres://cleared:cleared@localhost:5432/cleared
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (reads packageManager)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: migrate and seed (as `make reset && pnpm db:seed`)
        run: pnpm db:migrate && pnpm db:seed
      - name: Playwright browser cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Playwright Chromium
        run: pnpm --filter @cleared/web exec playwright install --with-deps chromium
      - run: pnpm --filter @cleared/web build
      - name: playwright test (default project)
        run: pnpm --filter @cleared/web exec playwright test
      - name: traces and screenshots on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-test-results
          path: apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 7

  security:
    name: gitleaks + audit
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history for gitleaks
      - name: install gitleaks (pinned, checksum-verified)
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$tarball" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$tarball"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks
      - name: gitleaks (full history)
        run: '"$RUNNER_TEMP/gitleaks" detect --no-banner --redact --log-opts="--all"'
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: pnpm audit (prod, high+)
        run: pnpm audit --prod --audit-level high
