# Local stack (M0-03). Postgres is the system of record: state, outbox, pg-boss jobs and evidence blobs
# (ADR 0002, ADR 0004). The major version matches Render's default for a new Postgres (18), which M0-08
# pins as `postgresMajorVersion` in render.yaml. Credentials match DATABASE_URL in .env.example.
# Host port = 5432 + PORT_OFFSET (the Makefile sets PG_PORT); the default stays 5432.
services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: cleared
      POSTGRES_PASSWORD: cleared
      POSTGRES_DB: cleared
    ports:
      - "${PG_PORT:-5432}:5432"
    # Postgres 18 images keep data under /var/lib/postgresql/<major>/docker, so the volume mounts the parent.
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cleared -d cleared"]
      interval: 1s
      timeout: 3s
      retries: 30
      start_period: 5s

volumes:
  pgdata:
